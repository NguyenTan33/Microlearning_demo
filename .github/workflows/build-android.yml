name: Build Android APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 🏗️ Build APK
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          npm_config_yes: true

      - name: 📥 Download APK
        run: |
          APK_URL=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['artifacts']['buildUrl'])")
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          echo "Downloading APK from: $APK_URL"
          curl -L "$APK_URL" -o microlearn-demo.apk
          ls -lh microlearn-demo.apk

      - name: 🏷️ Get tag
        id: tag
        run: |
          echo "tag=v1.0.0-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "MicroLearn Demo ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🎓 MicroLearn Video App – Demo APK

            ### 📱 Cách cài trên Android
            1. Tải file `microlearn-demo.apk` xuống điện thoại
            2. Mở file APK → nhấn **Cài đặt**
            3. Nếu hỏi "Unknown Sources" → cho phép → cài lại

            ### 🎯 Tính năng demo
            - ✅ Login (nhấn "Đăng nhập nhanh")
            - ✅ Video player với progress tracking  
            - ✅ Quiz MCQ sau mỗi bài học
            - ✅ Tải bài học offline
            - ✅ Toggle chế độ Offline/Online
            - ✅ Sync simulation

            ### ⚙️ Yêu cầu: Android 6.0+
          files: microlearn-demo.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
