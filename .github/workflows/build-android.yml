name: Build Android APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔐 Verify token & login
        run: |
          echo "Token length: ${#EXPO_TOKEN}"
          eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔗 Init EAS Project
        run: |
          echo "Linking/initializing EAS project..."
          eas init --account devminhtan --non-interactive --force || eas init --account devminhtans-team --non-interactive --force || eas init --non-interactive --force
          cat app.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build APK via EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Download built APK
        run: |
          echo "Downloading the generated APK..."
          eas build:download --platform android --non-interactive || true
          APK_FILE=$(ls -t *.apk 2>/dev/null | head -n 1 || echo "")
          if [ -z "$APK_FILE" ]; then
            echo "Falling back to build:list URL..."
            BUILD_JSON=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive)
            APK_URL=$(echo "$BUILD_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if data and len(data) > 0:
              print(data[0].get('artifacts', {}).get('buildUrl', ''))
          ")
            if [ -n "$APK_URL" ]; then
              echo "Downloading from: $APK_URL"
              curl -L "$APK_URL" -o microlearn-demo.apk
            else
              echo "❌ Could not find APK download URL"
              exit 1
            fi
          else
            if [ "$APK_FILE" != "microlearn-demo.apk" ]; then
              mv "$APK_FILE" microlearn-demo.apk
            fi
          fi
          ls -lh microlearn-demo.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🏷️ Generate release tag
        id: tag
        run: echo "tag=v1.0-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "🎓 MicroLearn Demo ${{ steps.tag.outputs.tag }}"
          body: |
            ## 📱 Tải APK cài lên Android

            ### Cách cài:
            1. Tải file `microlearn-demo.apk` bên dưới về điện thoại
            2. Mở file trên điện thoại Android → chọn **Cài đặt**
            3. Bật cho phép "Nguồn không xác định / Install unknown apps" nếu được hỏi

            ### Tính năng bản Demo:
            - 🔐 Đăng nhập (nhấn nút "Đăng nhập nhanh")
            - 📚 Khám phá danh sách khóa học, tìm kiếm, bộ lọc
            - 🎥 Video player với thanh tiến độ học
            - ❓ Quiz trắc nghiệm tương tác sau mỗi bài học
            - 📥 Tải bài học xem Offline không cần mạng
            - 🔄 Giả lập chế độ Offline & Đồng bộ dữ liệu

            **Yêu cầu:** Android 6.0 trở lên.
          files: microlearn-demo.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
